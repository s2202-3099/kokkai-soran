<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- site:start -->
<title>議員総覧</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 一枚のページの中で「版の一覧」「版（ある投票日の国会の全構成）」「人物」を # で切り替える。
   議席は一人一マスの議席図で見せ、色は党名ではなく系譜で塗る（同じ系譜の党は濃淡で分ける）。 */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --ink:#1a2030; --muted:#5b6274; --line:#d8dbe3; --soft:#e9ebf0;
  --accent:#2c3e8f; --scrim:rgba(20,24,36,.38); --tint:#ffffff;
  --l-hoshu:#2e7d4f; --l-ishin:#a37c12; --l-shinto:#d9731c; --l-chudo:#c2559a; --l-kaikaku:#6b4fb3;
  --l-saihen:#c0392b; --l-shakai:#2687ad; --l-kyosan:#7b2338; --l-shoha:#7d8494; --l-mush:#b9bec9;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e29; --ink:#e6e8ee; --muted:#9aa0b0; --line:#2c3242; --soft:#222838;
  --accent:#8fa2ec; --scrim:rgba(0,0,0,.55); --tint:#c9cdd8;
  --l-hoshu:#5fbf85; --l-ishin:#d6b04a; --l-shinto:#f0a05a; --l-chudo:#e58cc2; --l-kaikaku:#a58cec;
  --l-saihen:#ef7f73; --l-shakai:#5fbfe0; --l-kyosan:#d46a84; --l-shoha:#9aa0b0; --l-mush:#5a6070;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e29; --ink:#e6e8ee; --muted:#9aa0b0; --line:#2c3242; --soft:#222838;
  --accent:#8fa2ec; --scrim:rgba(0,0,0,.55); --tint:#c9cdd8;
  --l-hoshu:#5fbf85; --l-ishin:#d6b04a; --l-shinto:#f0a05a; --l-chudo:#e58cc2; --l-kaikaku:#a58cec;
  --l-saihen:#ef7f73; --l-shakai:#5fbfe0; --l-kyosan:#d46a84; --l-shoha:#9aa0b0; --l-mush:#5a6070;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
main.view{display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(28px,6vw,44px);font-weight:800}
h2{font-size:clamp(19px,3.2vw,24px);font-weight:800}
h3{font-size:16px;font-weight:800}
p{margin:0}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.lede{color:var(--muted);max-width:68ch}
.note{font-size:13px;color:var(--muted);max-width:76ch}
.num{font-variant-numeric:tabular-nums}

nav.top{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px}
nav.top a.home{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none}
nav.top .crumb::before{content:"›";margin-right:10px;color:var(--line)}
nav.top .search{margin-left:auto;position:relative;min-width:0;flex:1 1 220px;max-width:320px}
nav.top input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.results{position:absolute;right:0;left:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 8px 24px var(--scrim);z-index:20;max-height:60vh;overflow:auto}
.results a{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--soft)}
.results a:hover,.results a:focus{background:var(--soft)}
.results small{color:var(--muted);white-space:nowrap}

header.page{display:flex;flex-direction:column;gap:10px}
.totals{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.totals b{color:var(--ink);font-size:15px}

/* 議席の帯と議席図 */
.house{display:flex;flex-direction:column;gap:14px}
.house-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.house-head .sub{font-size:13px;color:var(--muted)}
.band{display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--soft)}
.band i{display:block;height:100%;background:color-mix(in oklab,var(--c) var(--m),var(--tint))}
.band i+i{box-shadow:inset 1px 0 0 var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend b{font-weight:700}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;flex:none;background:color-mix(in oklab,var(--c) var(--m),var(--tint))}
.sw.vac{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:2px;max-width:100%}
.seat{aspect-ratio:1;border-radius:2px;display:block;background:color-mix(in oklab,var(--c) var(--m),var(--tint))}
.seat:hover,.seat:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.seat.vac{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}

.fig-hemi{max-width:760px;width:100%;margin-inline:auto}
.hemi{width:100%;height:auto;display:block}
.hemi .hd{fill:color-mix(in oklab,var(--c) var(--m),var(--tint))}
.hemi .hd.vac{fill:none;stroke:var(--muted);stroke-width:.5}
.hemi a:hover .hd,.hemi a:focus-visible .hd{stroke:var(--ink);stroke-width:1.2}
.hemi .hn{font-family:var(--display);font-weight:800;font-size:20px;fill:var(--ink)}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font-size:13px;padding:5px 14px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
td.job{max-width:18em;overflow:hidden;text-overflow:ellipsis}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px 32px}
.pgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.pgroup h3 .sub{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.pgroup dl{margin:0;display:flex;flex-direction:column}
.pgroup dl div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:4px 0;border-bottom:1px solid var(--soft);font-size:14px}
.pgroup dt{color:var(--muted);overflow-wrap:anywhere}
.pgroup dd{margin:0;text-align:right}
.pgroup dd .sub{font-size:12px;color:var(--muted)}
.kin.nat{font-weight:700}
.kin .sub{font-size:11px;color:var(--muted)}
/* 名簿の表 */
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.controls input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;flex:0 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--soft);white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--muted);font-weight:700;z-index:1;box-shadow:0 1px 0 var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td .pty{display:inline-flex;align-items:center;gap:6px}
td .sub{font-size:12px;color:var(--muted)}
tbody tr:hover{background:var(--soft)}
td a{text-decoration:none}
td a:hover{text-decoration:underline}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{border-color:var(--l-ishin);color:var(--ink)}

/* 版の一覧 */
.vlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.vrow{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 24px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.vrow:hover .vdate{color:var(--accent)}
.vdate{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.25}
.vdate small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.vbands{display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:center}
.vband{display:grid;grid-template-columns:22px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.vband .band{height:12px}
@media (max-width:560px){.vrow{grid-template-columns:1fr}}

/* 異動 */
.events{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:96px 56px 1fr;gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:14px;align-items:baseline}
.ev time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.ev .k{font-size:12px;font-weight:700}
.ev .k.out{color:var(--l-saihen)} .ev .k.in{color:var(--l-hoshu)} .ev .k.gen{color:var(--accent)}
@media (max-width:480px){.ev{grid-template-columns:84px 1fr}.ev .k{grid-column:2}.ev .d{grid-column:1/-1}}

/* 人物 */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 24px;border-block:1px solid var(--line);padding-block:14px}
.facts div{display:flex;flex-direction:column;gap:2px;min-width:0}
.facts dt{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.facts dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tl{width:100%;height:auto;display:block}
.tl text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.tl .axis{stroke:var(--line)}
.tl .lane{fill:var(--soft)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips a{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface);font-variant-numeric:tabular-nums}
.vchips a.off{color:var(--muted);border-style:dashed;background:transparent}
.caveat{border-left:3px solid var(--line);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.srcs{display:flex;flex-direction:column;gap:2px;font-size:13px}
.srcs small{color:var(--muted)}
.loading{color:var(--muted);padding:40px 0}
section{display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
<!-- site:head-end -->
</head>
<body>
<!-- site:body -->
<div class="wrap">
  <nav class="top" aria-label="サイト">
    <a class="home" href="#">議員総覧</a>
    <span id="crumbs"></span>
    <div class="search">
      <label class="eyebrow" for="q" hidden>議員を探す</label>
      <input id="q" type="search" placeholder="議員を探す（名前・よみ）" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
  </nav>
  <main id="main" class="view"><p class="loading">台帳を読み込んでいます…</p></main>
  <footer class="note">公開情報（Wikipedia日本語版、総務省の選挙結果など）をもとに個人が作成している非公式の資料です。行ごとの根拠と出典は <a href="https://github.com/s2202-3099/kokkai-soran">台帳（GitHub）</a> にあります。<span id="built"></span></footer>
</div>
<script>
"use strict";
let seatView = "hemi";
try{ const v=localStorage.getItem("kokkai-seatview"); if(v==="grid"||v==="hemi") seatView=v; }catch(e){}
const LIN = [["保守系","hoshu"],["維新系","ishin"],["2019年以降の新党","shinto"],["中道系","chudo"],["中道改革連合","kaikaku"],
  ["非自民再編系","saihen"],["社会党系","shakai"],["共産党","kyosan"],["諸派","shoha"],["無所属","mush"]];
const LIN_ORDER = Object.fromEntries(LIN.map((l,i)=>[l[0],i]));
const LIN_TOKEN = Object.fromEntries(LIN);
const SHADES = [100,68,46,30];
const REASON_OUT = new Set(["辞職","死去","退職","失職","当選無効","除名","退任","辞任"]);
const BASIS = {doc:"当時の資料・選挙記事", art:"本人の記事", est:"推定", none:"未判明"};
let S; // 台帳
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pname = n => (n||"").replace(/（\d{4}年結成）$/,"");
const jdate = d => { if(!d) return ""; const [y,m,dd] = d.split("-"); return `${+y}年${m?+m+"月":""}${dd?+dd+"日":""}`; };
const sdate = d => d ? d.replace(/-/g,".") : "";

function age(birth, at){
  if(!birth || birth.length<10) return "";
  const [by,bm,bd]=birth.split("-").map(Number), [y,m,d]=at.split("-").map(Number);
  return y-by-((m<bm||(m===bm&&d<bd))?1:0);
}

async function load(){
  const r = await fetch("site.json");
  const j = await r.json();
  const P = new Map(j.persons.map(p=>[p[0],{id:p[0],name:p[1],kana:p[2],birth:p[3],death:p[4],sex:p[5],pref:p[6],title:p[7],qid:p[8],first:p[9],firstHouse:p[10],prevJob:p[11],kinChecked:p[12],terms:[],affs:[],alias:[],posts:[],kin:[],kinOf:[]}]));
  const E = new Map(j.elections.map(e=>[e[0],{id:e[0],house:e[1],n:e[2],date:e[3],kind:e[4],seats:e[5],src:e[6]}]));
  const T = j.terms.map(t=>({id:t[0],pid:t[1],house:t[2],eid:t[3],did:t[4],route:t[5],start:t[6],end:t[7],reason:t[8],basis:t[9],src:t[10],note:t[11]}));
  for(const t of T) P.get(t.pid).terms.push(t);
  for(const a of j.affs) P.get(a[0]).affs.push({org:a[1],start:a[2],end:a[3],basis:a[4],src:a[5],note:a[6],asOf:a[7]});
  for(const a of j.aliases) P.get(a[0])?.alias.push(a[1]);
  const POSTS=[];
  for(const r of j.posts){ const x={pid:r[0],kind:r[1],post:r[2],body:r[3],asOf:r[4],note:r[5],src:r[6]}; P.get(r[0]).posts.push(x); POSTS.push(x); }
  for(const k of j.kin){
    const x={pid:k[0],other:k[1],name:k[2],rel:k[3],cat:k[4],line:k[5],deg:k[6],title:k[7],nat:k[8]==="1",src:k[9]};
    P.get(k[0]).kin.push(x); if(k[1]&&P.get(k[1])) P.get(k[1]).kinOf.push(x);
  }
  for(const p of P.values()){ p.terms.sort((a,b)=>a.start<b.start?-1:1); p.affs.sort((a,b)=>a.start<b.start?-1:1); }
  const distOrder = new Map(Object.keys(j.districts).map((k,i)=>[k,i]));
  const versions = [...E.values()].filter(e=>e.house==="衆").sort((a,b)=>a.date<b.date?-1:1);
  versions.forEach((v,i)=>{ v.no=i+1; v.next=versions[i+1]||null; });
  // 参院の各組の任期（通常選挙の当選者の在職から）
  const span = {};
  for(const t of T) if(t.house==="参" && ["選挙区","比例","地方区","全国区"].includes(t.route)){
    const s = span[t.eid] ||= [t.start,t.end]; if(t.start<s[0]) s[0]=t.start; if(t.end>s[1]) s[1]=t.end; }
  S = {POSTS,P,E,T,orgs:j.orgs,dist:j.districts,distOrder,versions,span,src:j.sources,built:j.built};
  $("#built").textContent = ` 台帳の取得日 ${sdate(j.built)}。`;
}

/* ---- 時点の計算 ---- */
/* 衆院の総選挙の投票日には、その回の当選者だけを数える（1976年の任期満了選挙では、前の回の議員の任期が投票日の後まで続く） */
const isShuVote = D => [...S.E.values()].some(e=>e.house==="衆" && e.date===D);
const onAt = (t, D) => t.start<=D && (!t.end || t.end>=D) && !(t.house==="衆" && S.E.get(t.eid)?.date<D && isShuVote(D));
const inOffice = (house, D) => S.T.filter(t=>t.house===house && onAt(t, D));
/* 当選時の党派：その在職の始まり（または選挙の投票日）の所属。行がなければ無所属で当選した人。 */
/* 投票日の党派：参院議員はその日の所属（as_of の行）があればそれ、なければ当選時。衆院議員は当選時＝投票日。 */
function partyAt(t, D){
  if(t.house==="参"){
    const p=S.P.get(t.pid);
    const a=p.affs.find(x=>x.asOf===D && !isFaction(x.org));
    if(a) return a.org==="" ? {org:null, note:a.note, basis:a.basis} : a;
  }
  return partyOf(t);
}
function partyOf(t){
  const p=S.P.get(t.pid), d=S.E.get(t.eid).date;
  return p.affs.find(a=>a.start===t.start) || (t.route==="補選"||t.route==="繰上"||t.route==="再選挙" ? null : p.affs.find(a=>a.start===d)) || null;
}
const isFaction = id => ["派閥","グループ"].includes(S.orgs[id]?.[4]);
/* 派閥：その版の投票日から次の版の投票日までの間の「その日の所属」（as_of）。 */
function factionAt(p, v){
  const hi = v.next?.date;
  const a = p.affs.find(x=>isFaction(x.org) && x.asOf && x.asOf>=v.date && (!hi || x.asOf<hi));
  if(!a) return null;
  const label = (a.note.match(/【(.+?)】/)||[])[1] || S.orgs[a.org][0];
  return {a, label, kind:(a.note.match(/】；(推定|旧派閥[^；]*|解散前に退会)/)||[])[1]||"", asOf:a.asOf};
}
const POST_RANK = {"閣僚":0,"党首":1,"党執行部":1,"副大臣":2,"衆議院の役職":3,"参議院の役職":3,"大臣政務官":4,"党の幹部":5};
const inVer = (d, v) => d && d>=v.date && (!v.next || d<v.next.date);
function postsIn(p, v){ return p.posts.filter(x=>inVer(x.asOf,v)).sort((a,b)=>(a.asOf<b.asOf?-1:a.asOf>b.asOf?1:0)||(POST_RANK[a.kind]-POST_RANK[b.kind])); }
function kinCell(p){
  if(!p.kin.length) return p.kinChecked ? `<span class="sub">なし</span>` : "";
  const nat=p.kin.filter(k=>k.nat), loc=p.kin.filter(k=>!k.nat);
  const rels=a=>[...new Set(a.map(k=>k.rel))].slice(0,3).join("・");
  return nat.length ? `<span class="kin nat" title="${esc(nat.map(k=>k.rel+" "+k.name).join("、"))}">${esc(rels(nat))}</span>`

function lineageOf(orgId){ return orgId ? (S.orgs[orgId][1]||"諸派") : "無所属"; }
function winsBefore(p, house, D){ return p.terms.filter(t=>t.house===house && t.start<=D).length; }
/* 改選数に他の組の欠員を埋める任期3年の議席が入っていて、二つの組の改選数の和が定数にならない日（1969年：127＋126、定数250） */
const SAN_SEATS_AT = {"1960-11-20": 250, "1963-11-21": 250, "1967-01-29": 250, "1969-12-27": 250};
function sanSeats(D){
  let n=0; const groups=[];
  for(const [eid,[a,b]] of Object.entries(S.span)) if(a<=D && D<=b){ n+=S.E.get(eid).seats; groups.push(S.E.get(eid)); }
  return {seats:SAN_SEATS_AT[D]||n, groups:groups.sort((x,y)=>x.n-y.n)};
}

/* 党派ごとの集計と色。系譜の中では人数の多い順に濃い色から。 */
function composition(rows){
  const by = new Map();
  for(const r of rows){ const k=r.org||"無所属"; if(!by.has(k)) by.set(k,{org:r.org,name:r.org?pname(S.orgs[r.org][0]):"無所属",lin:lineageOf(r.org),n:0}); by.get(k).n++; }
  const groups = [...by.values()];
  const perLin = {};
  groups.sort((a,b)=>b.n-a.n).forEach(g=>{ const i=(perLin[g.lin] ||= 0); g.m=SHADES[Math.min(i,SHADES.length-1)]; perLin[g.lin]++; });
  groups.sort((a,b)=>(LIN_ORDER[a.lin]-LIN_ORDER[b.lin])||(b.n-a.n));
  const style = new Map(groups.map(g=>[g.org||"無所属",`--c:var(--l-${LIN_TOKEN[g.lin]||"shoha"});--m:${g.m}%`]));
  return {groups, style};
}
const bandHTML = (comp, total) => `<div class="band" role="img" aria-label="${esc(comp.groups.map(g=>g.name+g.n).join("、"))}">${

function bindTables(){

function eventsBlock(D, Dn){
  const ev=[];
  const inRange = d => d && d>D && (!Dn || d<Dn);
  for(const t of S.T){
    if(inRange(t.end) && REASON_OUT.has(t.reason)) ev.push({d:t.end,k:"out",lab:t.reason,t});
    else if(inRange(t.end) && t.reason && !["解散","任期満了"].includes(t.reason)) ev.push({d:t.end,k:"out",lab:"欠員",t});
    if(inRange(t.start) && ["補選","繰上","再選挙"].includes(t.route)) ev.push({d:t.start,k:"in",lab:t.route,t});
  }
  for(const e of S.E.values()) if(e.house==="参" && inRange(e.date)) ev.push({d:e.date,k:"gen",lab:"通常選挙",e});
  ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.k==="out"?-1:1));
  if(!ev.length) return `<p class="note">この間の異動はありません。</p>`;
  return `<div class="events">${ev.map(x=>{
    if(x.e) return `<div class="ev"><time>${sdate(x.d)}</time><span class="k gen">${x.lab}</span><span class="d">第${x.e.n}回参議院議員通常選挙（改選 ${x.e.seats}）</span></div>`;
    const p=S.P.get(x.t.pid), h=x.t.house==="衆"?"衆":"参";
    const extra = x.k==="in" ? "" : (x.t.note && /補欠選挙は行われず|欠員のまま/.test(x.t.note) ? "・補選なし" : "");
    return `<div class="ev"><time>${sdate(x.d)}</time><span class="k ${x.k}">${esc(x.lab)}</span><span class="d">${h}・${esc(S.dist[x.t.did]||"")} <a href="#${p.id}">${esc(p.name)}</a><span class="note">${extra}</span></span></div>`;
  }).join("")}</div>`;
}

      <div class="tablebox"><table><thead><tr><th>期間</th><th>院</th><th>選挙</th><th>選挙区</th><th>経路</th><th>党派（当選時）</th><th>根拠</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section aria-labelledby="vh2"><h2 id="vh2">載っている版</h2>
      <div class="vchips">${vchips||`<span class="note">どの版の投票日にも在職していません（版と版のあいだの補選・繰上で入り、次の投票日までに辞めた議員です）。</span>`}</div></section>
    <section aria-labelledby="sh"><h2 id="sh">出典</h2>
      <div class="srcs">${srcIds.map(id=>{const s=S.src[id]; if(!s) return ""; return `<span><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a> <small>${s[2]?"版 "+esc(s[2])+" ・ ":""}${sdate(s[3])}取得</small></span>`;}).join("")}</div>
    </section>
    <section class="caveat note"><p>当選回数と在職は、台帳に入っている範囲（${coverTxt()}）のものです。派閥と役職は各版の投票日時点、親族は自民党版の名簿（2009年・2026年）の分だけです。</p></section>`;
}
function sanPartyList(p){
  const xs=p.affs.filter(a=>a.asOf && !isFaction(a.org)).sort((a,b)=>a.asOf<b.asOf?-1:1);
  if(!xs.length) return "";
  return `<section aria-labelledby="sph"><h2 id="sph">各版の投票日の党派（参議院）</h2>
    <div class="tablebox"><table><thead><tr><th>投票日</th><th>党派</th><th>根拠</th></tr></thead><tbody>${xs.map(a=>{
      const lin=lineageOf(a.org||null), st=`--c:var(--l-${LIN_TOKEN[lin]||"shoha"});--m:100%`;
      return `<tr><td class="num"><a href="#${S.versions.find(v=>v.date===a.asOf)?.id||""}">${sdate(a.asOf)}</a></td>
        <td><span class="pty"><i class="sw" style="${st}"></i>${esc(a.org?pname(S.orgs[a.org][0]):"無所属")}</span></td>
        <td><span class="sub">${esc(BASIS[a.basis]||a.basis)}</span><div class="sub" style="white-space:normal;max-width:52ch">${esc(a.note.replace(/^投票日の党派；/,""))}</div></td></tr>`;}).join("")}</tbody></table></div>
    <p class="note">国会会議録で投票日までの最後の発言（なければ直後の発言）の会派と、当選時の党派から決めたもの。「本人の記事」とあるものは、記事の本文で一人ずつ確かめた。</p></section>`;
}
function coverTxt(){
  const first=h=>[...S.E.values()].filter(e=>e.house===h).map(e=>e.date).sort()[0]?.slice(0,4);
  return `衆議院は${first("衆")}年、参議院は${first("参")}年の選挙から`;
}
function facNote(v){
  if(v.n===45) return "自民党議員の派閥は、自民党版の名簿（2009年8月30日時点、一人ずつ確かめたもの）から取り込みました。";
  if(v.n===51) return "自民党議員の派閥は、自民党版の名簿（2026年10月15日時点）から取り込みました。2024年に解散した派閥は解散時の所属を「旧」で示しています。";
  const base = "自民党議員の派閥は、その時点の資料（内閣の記事の所属欄、総裁選の推薦人一覧、派閥の記事の時点つきの構成表）と、本人の記事にある派閥の移り変わりから当てたものです。確かめ済みの2009年の名簿で試すと、推薦人一覧は70人中69人、記事の移り変わりからの当てはめは約9割が一致しました。「推定」と添えたものは、離れた時点の名簿や、派閥の呼び名の年単位の期間から推し量ったものです。どの手がかりでも決まらなかった人は、他の時点（他の版・名簿・引退時の一覧など）で一度でも出てくる派閥に、退会の記述がない限りいたものとしています。それでも決められなかった人は「不明」です。";
  return v.n===50 ? base.replace("当てたものです。","当てたものです。この投票日には麻生派以外の派閥は解散していたので、解散時の所属を「旧」で示しています。") : base;
}
function postsSection(v, rows){
  // 台帳の並び（自民党版の序列）のまま。版の投票日に在職していない人（落選・引退した副大臣など）も載せる
  const byP=new Map(rows.map(r=>[r.p.id,r]));
  const items=S.POSTS.filter(x=>inVer(x.asOf,v)).map(x=>{ const r=byP.get(x.pid); return {...x,p:S.P.get(x.pid),org:r?r.org:null,out:!r}; });
  if(!items.length) return "";
  const groups=new Map();
  for(const it of items){ const k=`${it.kind}|${it.kind==="党首"?"各党":it.body}|${it.asOf}`; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(it); }
  const keys=[...groups.keys()].sort((a,b)=>(POST_RANK[a.split("|")[0]]-POST_RANK[b.split("|")[0]])||(a.split("|")[2]<b.split("|")[2]?-1:1));
  return `<section aria-labelledby="ph"><h2 id="ph">内閣と党の役職</h2>
    <div class="posts">${keys.map(k=>{ const [kind,body,asOf]=k.split("|"); const its=groups.get(k);
      return `<div class="pgroup"><h3>${esc(kind)}<span class="sub"> ${esc(body)} ・ ${sdate(asOf)}時点</span></h3>
        <dl>${its.map(it=>`<div><dt>${esc(it.kind==="党首"?pname(it.body)+" "+it.post:it.post)}</dt><dd><a href="#${it.p.id}">${esc(it.p.name)}</a>${it.org&&S.orgs[it.org][0]!=="自由民主党"?`<span class="sub">（${esc(pname(S.orgs[it.org][0]))}）</span>`:""}${it.out?`<span class="sub">（この版の議員ではない）</span>`:""}</dd></div>`).join("")}</dl></div>`;}).join("")}</div>
    <p class="note">内閣の役職は内閣の記事、党首は衆院選の記事の情報欄、自民党の役員と参議院議長は歴代一覧と本人の記事、2009年と2026年10月の分は自民党版の名簿によります。それぞれ表の時点で就いていた役職です。1996年と2000年は副大臣・政務官の制度がない（政務次官は未収録）。</p></section>`;
}
function kinSection(v, rows){
  const here=new Set(rows.map(r=>r.p.id)), pairs=[], seen=new Set();
  for(const r of rows) for(const k of r.p.kin) if(k.other && here.has(k.other)){
    const key=[r.p.id,k.other].sort().join("|"); if(seen.has(key)) continue; seen.add(key); pairs.push([r.p,k]); }
  const checked=rows.filter(r=>r.p.kinChecked).length;
  if(!checked) return "";
  const withNat=rows.filter(r=>r.p.kin.some(k=>k.nat)).length;
  return `<section aria-labelledby="kh"><h2 id="kh">親族でつながる議員</h2>
    <p class="note">親族を調べ終えた議員は${checked}人（自民党版の名簿の分）で、そのうち${withNat}人に国会議員の親族がいます。この版の議員どうしの親族関係は次のとおりです。</p>
    <div class="events">${pairs.length?pairs.map(([p,k])=>`<div class="ev"><span class="d"><a href="#${p.id}">${esc(p.name)}</a></span><span class="k">${esc(k.rel)}</span><span class="d"><a href="#${k.other}">${esc(S.P.get(k.other).name)}</a> <span class="note">${esc(k.title)}</span></span></div>`).join(""):`<p class="note">この版の中で親族どうしの議員はいません。</p>`}</div></section>`;
}
function postList(p){
  if(!p.posts.length) return "";
  const ps=p.posts.slice().sort((a,b)=>(a.asOf<b.asOf?-1:a.asOf>b.asOf?1:POST_RANK[a.kind]-POST_RANK[b.kind]));
  return `<section aria-labelledby="poh"><h2 id="poh">役職</h2>
    <div class="tablebox"><table><thead><tr><th>時点</th><th>役職</th><th>内閣・党・院</th><th>注記</th></tr></thead><tbody>${ps.map(x=>`<tr><td class="num">${sdate(x.asOf)}</td><td>${esc(x.post)}</td><td>${esc(x.body)}</td><td><span class="sub" style="white-space:normal">${esc(x.note)}</span></td></tr>`).join("")}</tbody></table></div>
    <p class="note">各版の投票日（と自民党版の名簿の時点）に就いていた役職です。版と版のあいだの役職はまだ入っていません。</p></section>`;
}
function kinList(p){
  if(!p.kin.length && !p.kinOf.length) return p.kinChecked ? `<section aria-labelledby="kih"><h2 id="kih">親族</h2><p class="note">政治家の親族は見つかっていません（自民党版の名簿で${sdate(p.kinChecked)}時点に確認）。</p></section>` : "";
  const ks=p.kin.slice().sort((a,b)=>(+a.deg||9)-(+b.deg||9));
  const kind=k=>[k.cat, k.line, k.deg!==""?`${k.deg}親等`:""].filter(Boolean).join("・");
  const rev=p.kinOf.filter(k=>!p.kin.some(m=>m.other===k.pid));
  return `<section aria-labelledby="kih"><h2 id="kih">親族</h2>
    ${ks.length?`<div class="tablebox"><table><thead><tr><th>続柄</th><th>名前</th><th>肩書</th><th>区分</th></tr></thead><tbody>${ks.map(k=>`<tr><td>${esc(k.rel)}</td><td>${k.other?`<a href="#${k.other}">${esc(k.name)}</a>`:esc(k.name)}${k.nat?` <span class="tag">国会</span>`:""}</td><td>${esc(k.title)}</td><td><span class="sub">${esc(kind(k))}</span></td></tr>`).join("")}</tbody></table></div>`:""}
    ${rev.length?`<p class="note">この人を親族に挙げている議員：${rev.map(k=>`<a href="#${k.pid}">${esc(S.P.get(k.pid).name)}</a>（${esc(k.name)}の${esc(k.rel)}）`).join("、")}</p>`:""}
    <p class="note">続柄は本人から見たもの。自民党版の名簿（${p.kinChecked?sdate(p.kinChecked)+"時点":"2009年・2026年"}）によります。</p></section>`;
}
function factionList(p){
  const fs=p.affs.filter(a=>isFaction(a.org)).sort((a,b)=>a.asOf<b.asOf?-1:1);
  if(!fs.length) return "";
  return `<section aria-labelledby="fh"><h2 id="fh">派閥</h2>
    <div class="tablebox"><table><thead><tr><th>時点</th><th>派閥</th><th>根拠・注記</th></tr></thead><tbody>${fs.map(a=>{
      const label=(a.note.match(/【(.+?)】/)||[])[1]||S.orgs[a.org][0];
      const rest=a.note.replace(/^【.+?】；?/,"");
      return `<tr><td class="num">${sdate(a.asOf)}</td><td>${esc(label)}</td><td><span class="sub">${esc(BASIS[a.basis]||a.basis)}</span>${rest?`<div class="sub" style="white-space:normal;max-width:48ch">${esc(rest)}</div>`:""}</td></tr>`;}).join("")}</tbody></table></div>
    <p class="note">各版の投票日時点の所属です。2009年と2026年は自民党版の名簿、それ以外は内閣の記事と本人の記事から当てたもの（「推定」を含む）です。</p></section>`;
}
/* 半円の議場図。座席を内側から外側の段に、段の長さに比例して配り、角度の順（左から右）に人を並べる。 */
function hemiSVG(items, seats){
  const N=items.length; if(!N) return "";
  const R=Math.max(4,Math.round(Math.sqrt(N*0.3))), r0=0.34;
  const radii=[...Array(R)].map((_,i)=>r0+(1-r0)*i/(R-1)), sum=radii.reduce((a,b)=>a+b,0);
  const cnt=radii.map(r=>Math.floor(N*r/sum)); let left=N-cnt.reduce((a,b)=>a+b,0);
  for(let i=R-1;left>0;i=(i-1+R)%R){ cnt[i]++; left--; }
  const pts=[]; radii.forEach((r,i)=>{ const n=cnt[i]; for(let j=0;j<n;j++){ const th=n===1?Math.PI/2:Math.PI*(1-j/(n-1)); pts.push({th,r}); } });
  pts.sort((a,b)=>(b.th-a.th)||(a.r-b.r));
  const gap=(1-r0)/(R-1), dot=Math.min(gap*0.42, Math.PI*r0/(cnt[0]-1||1)*0.45)*100;
  const circles=pts.map((pt,k)=>{
    const it=items[k], x=(Math.cos(pt.th)*pt.r*100).toFixed(2), y=(-Math.sin(pt.th)*pt.r*100).toFixed(2);
    if(it.vac) return `<circle class="hd vac" cx="${x}" cy="${y}" r="${(dot*0.86).toFixed(2)}"><title>欠員</title></circle>`;
    return `<a href="${it.href}"><circle class="hd" cx="${x}" cy="${y}" r="${dot.toFixed(2)}" style="${it.style}"><title>${esc(it.tip)}</title></circle></a>`;
  }).join("");
  return `<svg class="hemi" viewBox="-104 -104 208 110" role="img" aria-label="議場図（${N}議席）">${circles}<text x="0" y="-4" text-anchor="middle" class="hn">${seats}</text></svg>`;
}
function timeline(p){
  const y0=1992, y1=2032, W=1000, L=34, R=10, H=78;
  const x=d=>{ const [y,m=1,dd=1]=d.split("-").map(Number); return L+((y+(m-1)/12+(dd-1)/365)-y0)/(y1-y0)*(W-L-R); };
  const today = S.built;
  const lanes={"衆":14,"参":44};
  let g=`<rect class="lane" x="${L}" y="12" width="${W-L-R}" height="20" rx="2"></rect><rect class="lane" x="${L}" y="42" width="${W-L-R}" height="20" rx="2"></rect>
    <text x="0" y="27">衆</text><text x="0" y="57">参</text>`;
  for(let y=y0;y<=y1;y+=5){ g+=`<line class="axis" x1="${x(y+"-01-01")}" x2="${x(y+"-01-01")}" y1="8" y2="66"></line><text x="${x(y+"-01-01")}" y="${H}" text-anchor="middle">${y}</text>`; }
  for(const t of p.terms){
    const a=partyOf(t), lin=lineageOf(a?.org);
    const xa=x(t.start), xb=x(t.end||today);
    g+=`<rect x="${xa.toFixed(1)}" y="${lanes[t.house]+2}" width="${Math.max(2,xb-xa).toFixed(1)}" height="16" rx="2" style="fill:var(--l-${LIN_TOKEN[lin]||"shoha"})"><title>${esc(t.house)} ${sdate(t.start)}–${sdate(t.end)||"在職中"} ${esc(a?pname(S.orgs[a.org][0]):"無所属")}</title></rect>`;
  }
  return `<svg class="tl" viewBox="0 0 ${W} ${H+4}" role="img" aria-label="在職の期間の図">${g}</svg>`;
}

/* ---- 検索 ---- */
function bindSearch(){
  const q=$("#q"), box=$("#results");
  const norm=s=>(s||"").replace(/[\s　]/g,"");
  q.addEventListener("input",()=>{
    const v=norm(q.value); if(!v){ box.hidden=true; return; }
    const hits=[]; for(const p of S.P.values()){
      if(norm(p.name).includes(v)||norm(p.kana).includes(v)||p.alias.some(a=>norm(a).includes(v))){ hits.push(p); if(hits.length>=40) break; } }
    box.innerHTML = hits.length ? hits.map(p=>{
      const s=p.terms.filter(t=>t.house==="衆").length, n=p.terms.filter(t=>t.house==="参").length;
      return `<a href="#${p.id}"><span>${esc(p.name)} <small>${esc(p.kana)}</small></span><small>${s?`衆${s}`:""}${s&&n?"・":""}${n?`参${n}`:""}</small></a>`;}).join("")
      : `<a aria-disabled="true"><span>見つかりません</span></a>`;
    box.hidden=false;
  });
  box.addEventListener("click",()=>{ box.hidden=true; q.value=""; });
  document.addEventListener("click",e=>{ if(!e.target.closest(".search")) box.hidden=true; });
}

/* ---- 切り替え ---- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const v=S.versions.find(v=>v.id===h), p=S.P.get(h);
  if(v) renderVersion(v); else if(p) renderPerson(p); else renderTop();
  const t=v?`${jdate(v.date)}の国会`:p?p.name:"";
  document.title = t ? `${t} ・ 議員総覧` : "議員総覧";
  window.scrollTo(0,0);
}
load().then(()=>{ FACV=facVersions(); bindSearch(); route(); addEventListener("hashchange",route); })
  .catch(err=>{ $("#main").innerHTML=`<p class="loading">台帳（site.json）を読み込めませんでした。ページを開き直してください。（${esc(err.message)}）</p>`; });
</script>
